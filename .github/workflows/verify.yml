name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui-and-contracts:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
